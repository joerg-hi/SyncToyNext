name: Release-Notes bereinigen

# Nur manuell startbar: entfernt aus den Release-Notes eines Releases die
# Zeilen, die auf die angegebenen Pull Requests verweisen.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag des Releases (z. B. v1.1.0)'
        required: true
      prs:
        description: 'Nummern der zu entfernenden Pull Requests, mit Komma getrennt (z. B. 4,5)'
        required: true

permissions:
  contents: write

jobs:
  bereinigen:
    runs-on: ubuntu-latest
    steps:
      - name: Zeilen entfernen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PRS: ${{ inputs.prs }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body | tr -d '\r' > alt.md
          muster=$(echo "$PRS" | tr -d ' ' | sed 's/,/|/g')
          grep -Ev "/pull/(${muster})\$" alt.md > neu.md || true
          echo "--- Änderung ---"
          diff alt.md neu.md || true
          if cmp -s alt.md neu.md; then
            echo "Keine passenden Zeilen gefunden, nichts geändert."
            exit 0
          fi
          gh release edit "$TAG" --notes-file neu.md
